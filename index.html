:root{
  --teal:#14B8A6;
  --navy:#0F172A;
  --gold:#F59E0B;
  --bg:#0B1220;
  --surface:#16203A;
  --card:#1E293B;
  --ink:#FFFFFF;
  --body:#E2E8F0;
  --muted:#94A3B8;
  --line:#334155;
  --red:#FCA5A5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  color-scheme:dark
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  font-family:Manrope,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink)
}
button,input,select,textarea{
  font:inherit
}
a{
  color:inherit;
  text-decoration:none
}
.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  display:flex;
  background:var(--bg)
}
.sidebar{
  width:272px;
  flex:0 0 272px;
  background:var(--navy);
  color:#fff;
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:var(--safe-area-inset-top);
  height:calc(100vh - var(--safe-area-inset-top));
  overflow:auto
}
.logo{
  display:flex;
  gap:11px;
  align-items:center;
  margin-bottom:28px
}
.logo-mark{
  width:42px;
  height:42px;
  background:var(--teal);
  border-radius:13px;
  display:grid;
  place-items:center;
  color:#fff
}
.logo b{
  font-family:Fraunces,serif;
  font-size:19px;
  line-height:1.1
}
.logo small{
  display:block;
  color:#9FB1C2;
  font-size:11px;
  margin-top:3px
}
.side-label{
  font-size:11px;
  letter-spacing:.16em;
  color:#8EA6BA;
  margin:0 10px 10px
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#DCE6EE;
  padding:11px 10px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
  font-weight:700
}
.nav-btn.active{
  background:var(--teal);
  color:#fff
}
.nav-btn svg:last-child{
  margin-left:auto
}
.coach{
  background:#173A5A;
  border-radius:14px;
  padding:16px;
  margin-top:18px
}
.coach p{
  font-size:13px;
  line-height:1.5;
  color:#C8D6E1
}
.owner-mini{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:10px;
  border-top:1px solid #244561;
  padding-top:15px
}
.owner-mini small{
  display:block;
  color:#9FB1C2
}
.live{
  font-size:10px;
  color:#8EE6B5;
  margin-left:auto
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#D9EFEA;
  color:#0A5A4F;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:0 0 38px
}
.avatar.lg{
  background:var(--gold);
  color:#2A2200
}
.avatar.sm{
  width:36px;
  height:36px;
  flex-basis:36px
}
.avatar.xl{
  width:56px;
  height:56px;
  flex-basis:56px
}
.main{
  flex:1;
  min-width:0;
  padding:20px 26px 30px
}
.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  flex-wrap:wrap
}
.search{
  flex:1;
  min-width:210px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:9px
}
.search input{
  border:0;
  outline:0;
  width:100%
}
.team-tabs{
  display:flex;
  background:#E0E9E7;
  padding:4px;
  border-radius:999px
}
.tab{
  border:0;
  background:transparent;
  padding:8px 13px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer
}
.tab.active{
  background:var(--navy);
  color:#fff
}
.add-btn{
  border:0;
  background:var(--teal);
  color:#fff;
  border-radius:999px;
  padding:12px 18px;
  font-weight:800;
  display:flex;
  gap:7px;
  align-items:center;
  cursor:pointer;
  box-shadow:0 6px 16px #0A7A6B30
}
.mobile-menu{
  display:none
}
.banner{
  background:linear-gradient(100deg,var(--teal),#0F6F72);
  color:#fff;
  border-radius:20px;
  padding:22px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}
.banner h2{
  font-family:Fraunces,serif;
  font-size:27px;
  margin:10px 0 5px
}
.banner p{
  opacity:.9;
  margin:0
}
.pill{
  background:#FFDE68;
  color:#292100;
  font-size:11px;
  font-weight:900;
  padding:6px 9px;
  border-radius:999px
}
.banner button{
  border:0;
  background:#fff;
  color:#084F44;
  border-radius:999px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap
}
.greeting{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:24px 0 16px
}
.greeting h1{
  font-family:Fraunces,serif;
  font-size:36px;
  margin:5px 0
}
.greeting p{
  color:var(--muted);
  margin:0
}
.eyebrow{
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900;
  color:var(--teal)
}
.greeting-card{
  display:flex;
  gap:10px;
  background:#FFF8D8;
  border:1px solid #F0D97F;
  padding:12px 14px;
  border-radius:13px
}
.greeting-card small{
  display:block;
  color:var(--muted)
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.kpi{
  background:#fff;
  border-radius:16px;
  padding:18px;
  position:relative;
  overflow:hidden;
  border:1px solid #E5ECEA
}
.kpi span{
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--muted)
}
.kpi b{
  display:block;
  font-size:32px;
  margin:9px 0 4px
}
.kpi small{
  color:var(--muted)
}
.kpi i{
  position:absolute;
  right:13px;
  top:13px;
  font-style:normal;
  font-size:25px
}
.kpi.teal{
  border-top:5px solid var(--teal)
}
.kpi.navy{
  border-top:5px solid var(--navy)
}
.kpi.gold{
  border-top:5px solid var(--gold)
}
.grid2{
  display:grid;
  grid-template-columns:1.65fr .9fr;
  gap:16px;
  margin-top:16px
}
.panel{
  background:#fff;
  border-radius:18px;
  padding:20px;
  border:1px solid #E5ECEA
}
.panel-head,.section-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:16px
}
.panel h3,.section-head h1{
  margin:0;
  font-family:Fraunces,serif
}
.panel-head p,.section-head p{
  color:var(--muted);
  margin:5px 0 0
}
.text-btn,.open-link{
  border:0;
  background:none;
  color:var(--teal);
  font-weight:800;
  cursor:pointer
}
.call-list{
  margin-top:16px
}
.call-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-top:1px solid #EEF3F2
}
.person{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0
}
.person b{
  display:block
}
.person small,.person p{
  color:var(--muted);
  font-size:13px;
  margin:2px 0
}
.person em{
  color:var(--red);
  font-style:normal
}
.check{
  width:27px;
  height:27px;
  border:2px solid #B9C9C5;
  background:#fff;
  border-radius:7px;
  cursor:pointer;
  color:var(--teal);
  font-weight:900
}
.mini{
  padding:8px 11px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  display:flex;
  gap:5px;
  align-items:center
}
.mini.call{
  background:#E8F5F2;
  color:#0A5A4F
}
.mini.wa{
  background:#E7F7EA;
  color:#176838
}
.mini.ghost{
  background:#EEF2F1
}
.overdue{
  background:#FDECEA;
  color:#7E221B;
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
  font-size:13px
}
.funnel-row{

.team-card label{

.settings-grid{

  grid-template-columns:1fr 1.2fr;

}
.settings ol{

}
.muted{

}
.status{

}

  right:16px;

}

  gap:8px;
  align-items:center;
  padding:7px 0
}
.docs span{
  margin-left:auto;
  font-size:12px;
  color:var(--muted)
}

  display:flex;
  gap:10px;
  padding:7px 0
}
.timeline p{
  margin:2px 0

  gap:8px;

  background:#fff;

  width:min(680px,calc(100% - 24px));
  border-radius:20px;
  padding:26px;
  position:relative;
  max-height:92vh;
  overflow:auto
}
.modal h2{

  margin:8px 0
}
.steps{
  display:flex;
  gap:8px;
  margin:14px 0
}
.steps span{
  padding:7px 11px;
  border-radius:99px;
  background:#EDF2F1;
  font-size:12px;
  font-weight:800
}
.steps span.on{
  background:#D9EFEA;
  color:#0A5A4F
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}
.assign-note{
  background:#FFF8D8;
  padding:12px;
  border-radius:10px
}
.modal-foot{
  display:flex;
  justify-content:space-between;
  margin-top:20px
}
.primary{
  border:0;
  background:var(--teal);
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
  font-weight:900;
  cursor:pointer
}
.ghost-btn{
  border:0;
  background:#EDF2F1;
  padding:12px 16px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer
}
.small-modal{
  background:#fff;
  margin:auto;
  width:min(420px,calc(100% - 24px));
  border-radius:18px;
  padding:24px
}
.small-modal>div{
  display:flex;
  gap:10px;
  margin-top:16px
}
.small-modal button{
  flex:1;
  border:0;
  background:#EDF2F1;
  padding:11px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer
}
.small-modal .danger{
  background:#C43A2E;
  color:#fff
}
.small-modal select{
  width:100%;
  margin-top:10px
}
.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:22px;
  background:var(--navy);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  z-index:100;
  font-weight:800;
  box-shadow:0 10px 30px #0003
}
@media(max-width:900px){
  .sidebar{
    position:fixed;
    left:-300px;
    z-index:60;
    transition:.2s
  }
  .sidebar.open{
    left:0
  }
  .mobile-menu{
    display:block;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:10px
  }
  .kpis{
    grid-template-columns:1fr 1fr
  }
  .grid2,.today-grid,.lead-grid,.renew-grid,.team-grid,.settings-grid{
    grid-template-columns:1fr
  }
  .banner{
    flex-direction:column;
    align-items:start
  }
  .kanban{
    grid-template-columns:repeat(7,220px)
  }
  .main{
    padding:14px
  }
  .topbar{
    flex-wrap:wrap
  }
  .team-tabs{
    order:3;
    width:100%;
    overflow-x:auto
  }
  .greeting{
    flex-direction:column;
    align-items:start;
    gap:12px
  }
  .drawer-grid,.form-grid,.docs{
    grid-template-columns:1fr
  }
  .call-row{
    flex-wrap:wrap
  }
  .call-row .person{
    min-width:180px
  }
  .section-head{
    flex-direction:column
  }
  .overlay{
    justify-content:center
  }
  .modal{
    margin:12px
  }
}
@media(max-width:520px){
  .kpis{
    grid-template-columns:1fr
  }
  .greeting h1,.section-head h1{
    font-size:29px
  }
  .banner h2{
    font-size:23px
  }
  .search{
    order:2;
    width:100%
  }
  .add-btn{
    margin-left:auto
  }
  .funnel-row{
    grid-template-columns:90px 1fr 24px
  }
}

  color:#FFFFFF
}
.done-row{
  background:#1E293B;
  color:#E2E8F0;
  border:1px solid #334155
}
.done-row button{
  background:#334155;
  color:#FFFFFF
}
.field{
  color:#E2E8F0
}
.field input,.field select,select,.note-row input,.settings textarea{
  background:#1E293B;
  color:#FFFFFF;
  border:1px solid #334155
}
.field button,.clear,.ghost-btn,.close,.small-modal button{
  background:#334155;
  color:#FFFFFF;
  border:1px solid #334155
}
.note-row button{
  background:#14B8A6;
  color:#FFFFFF
}
.text-btn,.open-link,.card-actions span{
  color:#2DD4BF
}
.lead-card{
  color:#E2E8F0
}
.phone{
  color:#E2E8F0
}
.card-foot{
  border-top-color:#334155;
  color:#94A3B8
}
.red{
  color:#FCA5A5
}
.kanban{
  background:transparent
}
.column{
  background:#0F172A;
  border:1px solid #334155;
  color:#E2E8F0
}
.col-head span{
  background:#334155;
  color:#FFFFFF
}
.kan-actions .lost,.drawer-foot .lost{
  background:#7F1D1D;
  color:#FECACA
}
.kan-actions .ghost2{
  background:#334155;
  color:#FFFFFF
}
.col-empty{
  color:#94A3B8
}
table{
  color:#E2E8F0
}
th{
  color:#94A3B8
}
td{
  border-top-color:#334155
}
.green{
  color:#4ADE80
}
.note-box,.assign-note{
  background:#16203A;
  border:1px solid #334155;
  color:#E2E8F0
}
.renew-card{
  color:#E2E8F0
}
.days{
  background:#78350F;
  color:#FDE68A
}
.auto{
  background:#16203A;
  border:1px solid #334155;
  color:#E2E8F0
}
.team-stats{
  border-top-color:#334155
}
.team-card label button{
  background:#334155;
  color:#FFFFFF
}
.settings ol,.settings-grid{
  color:#E2E8F0
}
.muted{
  color:#94A3B8
}
.status{
  background:#16203A;
  border:1px solid #334155;
  color:#E2E8F0
}
.fields span{
  background:#1E293B;
  border:1px solid #334155;
  color:#E2E8F0
}
footer{
  color:#94A3B8
}
.overlay{
  background:rgba(2,6,23,.82)
}
.drawer-grid>div,.docs,.timeline{
  background:#1E293B;
  border:1px solid #334155;
  color:#E2E8F0
}
.drawer-grid p,.timeline p{
  color:#E2E8F0
}
.timeline b{
  color:#FFFFFF
}
.drawer-foot button{
  background:#334155;
  color:#FFFFFF
}
.steps span{
  background:#334155;
  color:#E2E8F0
}
.steps span.on{
  background:#0F766E;
  color:#FFFFFF
}
.modal-foot{
  color:#E2E8F0
}
.small-modal .danger{
  background:#991B1B;
  color:#FFFFFF
}
.toast{
  background:#1E293B;
  color:#FFFFFF;
  border:1px solid #334155;
  box-shadow:0 10px 30px rgba(0,0,0,.55)
}
button{
  background:#334155;
  color:#FFFFFF;
  border:1px solid #334155;
  cursor:pointer
}
.panel-head button{
  background:#334155;
  color:#E2E8F0
}
.nav-btn{
  background:transparent;
  border:0;
  color:#DCE6EE
}
.nav-btn.active{
  background:#14B8A6;
  color:#FFFFFF
}
.text-btn,.open-link{
  background:none;
  border:0
}
.check{
  color:#FFFFFF
}
.conn-status{
  display:flex;
  align-items:center;
  gap:8px;
  background:#16203A;
  border:1px solid #334155;
  color:#FDE68A;
  border-radius:999px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800
}
.conn-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#F59E0B;
  flex:0 0 10px;
  box-shadow:0 0 0 4px rgba(245,158,11,.18)
}
.conn-status.connected{
  color:#BBF7D0;
  border-color:#166534
}
.conn-status.connected .conn-dot{
  background:#22C55E;
  box-shadow:0 0 0 4px rgba(34,197,94,.18)
}
.demo-banner{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  background:#16203A;
  border:1px solid #F59E0B;
  border-radius:16px;
  padding:16px 18px;
  margin:14px 0;
  color:#E2E8F0
}
.demo-banner.connected{
  border-color:#22C55E
}
.demo-banner p{
  color:#94A3B8;
  margin:6px 0 0;
  font-size:13px;
  line-height:1.5
}
.primary:disabled,.full:disabled{
  opacity:.6;
  cursor:wait
}
.demo-actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end
}
.demo-actions button{
  border:0;
  border-radius:999px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
  background:#14B8A6;
  color:#fff
}
.demo-actions .ghost-btn{
  background:#334155;
  color:#fff
}
.demo-banner.wa-preview{
  border-color:#14B8A6
}
.demo-banner.wa-preview .mini.wa{
  padding:11px 16px
}
@media(max-width:640px){
  .demo-banner{
    flex-direction:column;
    align-items:flex-start
  }
  .conn-status{
    order:3;
    width:100%;
    justify-content:center
  }
}
/* Login + clean empty states — dark only */
.login-shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 16px 24px;
  display:grid;
  place-items:center;
  background:#0B1220
}
.login-card{
  width:min(480px,100%);
  background:#16203A;
  border:1px solid #334155;
  border-radius:22px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.45)
}
.login-logo{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:20px
}
.login-logo b{
  font-family:Fraunces,serif;
  font-size:22px;
  color:#FFFFFF
}
.login-logo small{
  display:block;
  color:#94A3B8;
  font-size:12px;
  margin-top:2px
}
.login-card h1{
  font-family:Fraunces,serif;
  font-size:34px;
  margin:0;
  color:#FFFFFF
}
.login-sub{
  color:#94A3B8;
  line-height:1.6;
  margin:8px 0 18px
}
.login-form{
  display:grid;
  gap:12px
}
.login-form .field{
  margin:0
}
.pass-wrap{
  position:relative;
  display:block
}
.pass-wrap input{
  width:100%;
  padding-right:44px
}
.eye-btn{
  position:absolute;
  right:6px;
  top:6px;
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#94A3B8;
  display:grid;
  place-items:center;
  border-radius:8px
}
.login-error{
  background:#7F1D1D;
  border:1px solid #991B1B;
  color:#FECACA;
  padding:11px 12px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  margin:0
}
.login-btn{
  width:100%;
  justify-content:center;
  margin-top:4px
}
.demo-creds{
  background:#0B1220;
  border:1px solid #334155;
  border-radius:14px;
  padding:14px 16px;
  margin-top:18px;
  color:#E2E8F0
}
.demo-creds p{
  margin:10px 0;
  color:#E2E8F0
}
.demo-creds span{
  color:#94A3B8
}
.demo-creds small{
  display:block;
  color:#94A3B8;
  margin-top:8px;
  line-height:1.5
}
.login-foot{
  color:#94A3B8;
  text-align:center;
  font-size:13px;
  margin:14px 0 0
}
.user-chip{
  display:flex;
  align-items:center;
  gap:8px;
  background:#16203A;
  border:1px solid #334155;
  border-radius:999px;
  padding:4px 12px 4px 4px
}
.user-chip b{
  display:block;
  font-size:13px;
  color:#FFFFFF;
  line-height:1.1
}
.user-chip small{
  color:#94A3B8;
  font-size:11px
}
.logout-btn{
  display:flex;
  align-items:center;
  gap:7px;
  background:#7F1D1D!important;
  border-color:#991B1B!important;
  color:#FECACA!important;
  padding:11px 14px;
  border-radius:999px;
  font-weight:800
}
.empty{
  background:#16203A;
  border:1px dashed #475569;
  border-radius:16px;
  padding:28px;
  text-align:center;
  display:grid;
  justify-items:center;
  gap:6px;
  color:#94A3B8
}
.empty h3{
  margin:6px 0 0;
  color:#FFFFFF
}
.empty p{
  margin:0 0 10px;
  max-width:420px;
  line-height:1.5
}
.empty .primary{
  display:flex;
  align-items:center;
  gap:6px
}
.stage-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px
}
.stage-btn{
  border:1px solid #334155;
  background:#0B1220;
  color:#E2E8F0;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700
}
.stage-btn.active{
  background:#14B8A6;
  border-color:#14B8A6;
  color:#FFFFFF
}
@media(max-width:640px){
  .login-card{
    padding:22px
  }
  .user-chip{
    display:none
  }
  .logout-btn{
    margin-left:auto
  }
}
