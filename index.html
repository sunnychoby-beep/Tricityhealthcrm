<style>
:root{
  --teal:#14B8A6;--teal-d:#0F8C7E;--navy:#0F172A;--gold:#F59E0B;--bg:#0B1220;--surface:#16203A;--card:#1E293B;
  --card2:#243247;--ink:#FFFFFF;--body:#E2E8F0;--muted:#94A3B8;--line:#334155;--red:#F87171;--red-bg:#3B1D24;
  --green:#4ADE80;--green-bg:#14301F;--gold-bg:#3A2C10;--blue:#93C5FD;--blue-bg:#172A46;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--body);font-family:Manrope,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;color:var(--ink)}
.serif{font-family:Fraunces,serif}
.muted{color:var(--muted)}
.hide{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.brand{display:flex;gap:11px;align-items:center}
.brand .mark{width:42px;height:42px;border-radius:13px;background:var(--teal);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;flex:0 0 42px}
.brand b{font-family:Fraunces,serif;font-size:19px;color:var(--ink);display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11px}
.login h1{font-family:Fraunces,serif;font-size:28px;margin:22px 0 14px}

/* forms */
.field{display:grid;gap:6px;font-size:12px;font-weight:800;color:var(--muted);margin-top:12px}
.field.inline{margin-top:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;color:var(--ink);font-weight:600}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--card2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--teal);color:#04201C}
.btn.gold{background:var(--gold);color:#2A1C00}
.btn.wa{background:#1FA855;color:#fff}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:wait}
.error{background:var(--red-bg);color:var(--red);padding:10px 12px;border-radius:10px;font-weight:700;margin-top:12px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:var(--navy);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side nav{margin-top:24px;display:grid;gap:2px}
.nav{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;font-weight:700;color:#CBD5E1;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav:hover{background:#1A2540}
.nav.on{background:var(--teal);color:#04201C}
.nav .count{font-size:11px;background:#0008;color:#fff;border-radius:99px;padding:1px 7px}
.nav.on .count{background:#04201C;color:#fff}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#2A1C00;display:grid;place-items:center;font-weight:800;flex:0 0 36px}
.main{flex:1;min-width:0;padding:20px 24px 40px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{flex:1;min-width:200px;position:relative}
.search input{padding-left:36px;border-radius:999px;height:44px;background:var(--surface)}
.search span{position:absolute;left:13px;top:12px;color:var(--muted)}
.conn{font-size:12px;font-weight:800;padding:8px 11px;border-radius:999px;border:1px solid var(--line);display:flex;gap:6px;align-items:center;cursor:pointer;background:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.ok .dot{background:#22C55E}.conn.bad .dot{background:var(--red)}
.menu-btn{display:none}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.head h1{font-family:Fraunces,serif;font-size:30px}
.head p{margin:4px 0 0;color:var(--muted)}

/* cards & panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-family:Fraunces,serif;font-size:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--teal)}
.kpi.gold{border-top-color:var(--gold)}.kpi.red{border-top-color:var(--red)}.kpi.blue{border-top-color:var(--blue)}.kpi.green{border-top-color:var(--green)}
.kpi span{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kpi b{display:block;font-size:28px;color:var(--ink);margin:6px 0 2px}
.kpi small{color:var(--muted)}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who{flex:1;min-width:0;cursor:pointer}
.row .who b{color:var(--ink);display:block}
.row .who small{color:var(--muted)}
.bar-row{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;margin-top:9px;font-size:13px}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:9px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;background:var(--card2);color:var(--body);white-space:nowrap;display:inline-block}
.tag.Hot{background:var(--red-bg);color:var(--red)}.tag.Warm{background:var(--gold-bg);color:var(--gold)}.tag.Cold{background:var(--blue-bg);color:var(--blue)}
.tag.ok{background:var(--green-bg);color:var(--green)}.tag.bad{background:var(--red-bg);color:var(--red)}.tag.warn{background:var(--gold-bg);color:var(--gold)}
.overdue{color:var(--red);font-weight:800}

.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.lead:hover{border-color:var(--teal)}
.lead h3{font-family:Fraunces,serif;font-size:18px;margin:10px 0 2px}
.lead .meta{color:var(--muted);font-size:13px;margin:4px 0}
.lead .foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:9px;font-size:12px;color:var(--muted)}
.lead .acts{display:flex;gap:6px;margin-top:10px}
.lead .acts .btn{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;min-width:130px}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.col-h b{color:var(--ink);font-size:13px}
.kcard{background:var(--card);border-radius:10px;padding:10px;margin-top:8px;border:1px solid transparent}
.kcard:hover{border-color:var(--teal)}
.kcard b{color:var(--ink);cursor:pointer}
.kcard p{margin:4px 0;font-size:12px;color:var(--muted)}
.kcard .k-acts{display:flex;gap:5px;margin-top:7px}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;padding:12px;color:var(--muted);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#1A2540}

/* drawer & modal */
.overlay{position:fixed;inset:0;background:#020617B3;z-index:50;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:12px}
.drawer{background:var(--surface);width:min(680px,100%);height:100%;overflow:auto;padding:24px;border-left:1px solid var(--line)}
.modal{background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px;border:1px solid var(--line)}
.modal h2,.drawer h2{font-family:Fraunces,serif;font-size:24px}
.x{float:right;border:0;background:var(--card2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.sec{background:var(--card);border-radius:12px;padding:14px;margin-top:14px}
.sec h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--body)}
.chip input{width:14px;height:14px}
.member{display:grid;grid-template-columns:1.3fr .8fr auto;gap:8px;margin-top:8px}
.notes-list{max-height:220px;overflow:auto;margin-top:8px}
.note{padding:8px 0;border-top:1px solid var(--line);font-size:13px;white-space:pre-wrap;word-break:break-word}
.note:first-child{border-top:0}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px;font-size:13px}
.facts div>span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.facts div b{color:var(--ink);font-weight:700;word-break:break-word}
.actions-bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions-bar .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--teal);color:#04201C;font-weight:800;padding:11px 18px;border-radius:999px;z-index:100;box-shadow:0 10px 30px #0008;max-width:calc(100% - 24px);text-align:center}
.toast.bad{background:var(--red);color:#2A0505}
.loading{padding:40px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.cols,.cols3{grid-template-columns:1fr}}
@media(max-width:820px){
  .side{position:fixed;left:-270px;z-index:60;transition:left .2s}
  .side.open{left:0;box-shadow:0 0 0 100vmax #0008}
  .menu-btn{display:inline-flex}
  .main{padding:14px 16px 30px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.facts{grid-template-columns:1fr}
  .head h1{font-size:25px}
}
.more-row{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:center;padding:16px;color:var(--muted)}
</style>

<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
(function(){
"use strict";
var C = window.CRM_CONFIG;
var STAGES = ["New Lead","Contacted","Needs Analyzed","Quote Sent","Follow-up","Documents Pending","Policy Sold","Lost"];
var OPEN_STAGES = STAGES.slice(0,6);
var PRIORITIES = ["Hot","Warm","Cold"];
var CITIES = ["Chandigarh","Mohali","Panchkula","Zirakpur","Kharar","Other (India)"];
var CONDITIONS = ["Diabetes","BP","Thyroid","Heart","Asthma","Kidney","Cancer history","Cholesterol","Other"];
var HOSPITALS = ["PGIMER Chandigarh","GMCH-32 Chandigarh","GMSH-16 Chandigarh","Fortis Mohali","Max Mohali","IVY Mohali","Healing Hospital Sec-34","Alchemist Panchkula","Paras Panchkula","Command Hospital Chandimandir"];
var INSURERS = ["Niva Bupa","Star Health","Care Health","HDFC ERGO","ICICI Lombard","Aditya Birla Health","Bajaj Allianz","Tata AIG","ManipalCigna","SBI General","New India Assurance","Other"];
var DOCS = ["Aadhaar","PAN","Medical reports","Old policy copy","Nominee details","Bank / cancelled cheque","Photo"];
var LOST_REASONS = ["Price too high","Already bought elsewhere","Not reachable","Not interested now","Health / not eligible","Chose another advisor","Wrong number","Other"];
var CALL_OUTCOMES = ["Connected","No answer","Busy / call back","Switched off","Wrong number"];
var CLAIM_STATUS = ["Intimated","Documents Pending","Under Review","Approved","Partly Approved","Rejected","Settled"];
var RELATIONS = ["Self","Spouse","Son","Daughter","Father","Mother","Father-in-law","Mother-in-law","Other"];

/* ---------------- helpers ---------------- */
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function dash(v){ return (v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length)) ? '<span class="muted">—</span>' : esc(v); }
function money(n){ if(n===null||n===undefined||n===""||isNaN(Number(n))) return '<span class="muted">—</span>'; return "₹"+Number(n).toLocaleString("en-IN"); }
function today(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysUntil(ds){ if(!ds) return null; var a=new Date(today()+"T00:00:00"), b=new Date(String(ds).slice(0,10)+"T00:00:00"); return Math.round((b-a)/864e5); }
function fmtDate(ds){ if(!ds) return '<span class="muted">—</span>'; var d=new Date(String(ds).length<=10?ds+"T00:00:00":ds); if(isNaN(d)) return esc(ds); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); }
function fmtWhen(ts){ if(!ts) return '<span class="muted">never</span>'; var d=new Date(ts); return d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
function nowStamp(){ var d=new Date(); return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
function digits(p){ var d=String(p||"").replace(/\D/g,""); if(d.length===12&&d.indexOf("91")===0) d=d.slice(2); return d; }
function waLink(p,msg){ var d=digits(p); if(d.length===10) d="91"+d; return "https://wa.me/"+d+(msg?"?text="+encodeURIComponent(msg):""); }
function telLink(p){ var d=digits(p); return "tel:"+(d.length===10?"+91"+d:d); }
function initials(n){ return String(n||"?").trim().split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }
function opt(list,sel,blank){ return (blank!==undefined?'<option value="">'+esc(blank)+'</option>':"")+list.map(function(o){return '<option'+(String(o)===String(sel==null?"":sel)?" selected":"")+'>'+esc(o)+'</option>';}).join(""); }
function num(v){ if(v===""||v===null||v===undefined) return null; var n=Number(String(v).replace(/[^\d.]/g,"")); return isNaN(n)?null:n; }
function str(v){ v=(v==null?"":String(v)).trim(); return v===""?null:v; }
function noteLines(t){ return String(t||"").split("\n").map(function(s){return s.trim();}).filter(Boolean); }
function isOpen(l){ return OPEN_STAGES.indexOf(l.stage||"New Lead")>=0; }
function stageOf(l){ return STAGES.indexOf(l.stage)>=0?l.stage:"New Lead"; }

/* ---------------- auth + API ---------------- */
var KEY="crm_session", timer=null, session=null;
var LEGACY=/^eyJ/.test(C.anonKey||"");
function baseHeaders(){ var h={apikey:C.anonKey,"Content-Type":"application/json",Accept:"application/json"}; if(session) h.Authorization="Bearer "+session.access_token; else if(LEGACY) h.Authorization="Bearer "+C.anonKey; return h; }
function saveS(x){ try{localStorage.setItem(KEY,JSON.stringify(x));}catch(e){} }
function loadS(){ try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;} }
function clearS(){ try{localStorage.removeItem(KEY);}catch(e){} }
async function authPost(path,body,tok){
  var h={apikey:C.anonKey,"Content-Type":"application/json"}; if(tok) h.Authorization="Bearer "+tok;
  var r=await fetch(C.url+"/auth/v1/"+path,{method:"POST",headers:h,body:JSON.stringify(body||{})});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok){ var m=j.error_description||j.msg||j.message||("Login failed ("+r.status+")"); if(/invalid login credentials/i.test(m)) m="Wrong email or password"; throw new Error(m); }
  return j;
}
function applyS(x){ session=x; clearTimeout(timer); var ms=Math.max(30,(x.expires_in||3600)-120)*1000; timer=setTimeout(function(){ refreshS(x.refresh_token,x.member).catch(function(){}); },ms); }
async function refreshS(rt,member){ var x=await authPost("token?grant_type=refresh_token",{refresh_token:rt}); x.member=member; applyS(x); saveS(x); return x; }
async function api(method,path,body,prefer){
  var h=baseHeaders(); if(prefer) h.Prefer=prefer;
  var r=await fetch(C.url+"/rest/v1/"+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401 && session){ try{ await refreshS(session.refresh_token,session.member); h=baseHeaders(); if(prefer) h.Prefer=prefer; r=await fetch(C.url+"/rest/v1/"+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}); }catch(e){} }
  if(!r.ok){ var t=await r.text().catch(function(){return "";}); var hint=""; if(/column .* does not exist|Could not find the .* column|relation .*claims.* does not exist/i.test(t)) hint=" — run supabase_update_v2.sql in Supabase"; throw new Error("Supabase "+r.status+": "+t.slice(0,180)+hint); }
  if(r.status===204) return null;
  return r.json().catch(function(){return null;});
}
/* Supabase sends at most 1000 rows per request, so load in pages (5 at a time).
   MAX_LEADS = how many of the newest leads the CRM loads (1 lakh). */
var MAX_LEADS=100000, SHOW_STEP=200;
async function apiAll(path,max,onProgress){
  max=max||MAX_LEADS; var sep=path.indexOf("?")>=0?"&":"?", seen={}, all=[];
  function add(rows){ (rows||[]).forEach(function(r){ var k=r&&r.id!=null?String(r.id):JSON.stringify(r); if(!seen[k]){ seen[k]=1; all.push(r); } }); }
  function get(off,lim){ return api("GET",path+sep+"limit="+lim+"&offset="+off); }
  var first=await get(0,Math.min(1000,max)); first=first||[]; add(first);
  if(!first.length || all.length>=max) return all.slice(0,max);
  var ps=first.length, off=ps;            /* page size the server actually allows */
  while(all.length<max){
    var reqs=[];
    for(var k=0;k<5 && off+k*ps<max;k++) reqs.push(get(off+k*ps,ps));
    if(!reqs.length) break;
    var pages=await Promise.all(reqs), done=false;
    for(var i=0;i<pages.length;i++){ var rows=pages[i]||[]; add(rows); if(rows.length<ps){ done=true; break; } }
    off+=reqs.length*ps;
    if(onProgress) onProgress(all.length);
    if(done) break;
  }
  return all.slice(0,max);
}
async function findMember(tok,email){
  var r=await fetch(C.url+"/rest/v1/team_members?select=name,role&auth_email=eq."+encodeURIComponent(email.toLowerCase()),{headers:{apikey:C.anonKey,Authorization:"Bearer "+tok,Accept:"application/json"}});
  var rows=r.ok?await r.json():[]; if(!rows.length) throw new Error("This email is not on the team list. Add it to team_members in Supabase."); return rows[0];
}

/* ---------------- state ---------------- */
var S={ user:null, view:"Dashboard", leads:[], policies:[], claims:[], team:[], conn:"checking", connMsg:"",
  q:"", f:{stage:"All",priority:"All",city:"All",assigned:"All",source:"All"}, open:null, modal:null, busy:false, loginErr:"", claimsMissing:false, showN:SHOW_STEP };
var VIEWS=["Dashboard","Today's Calls","All Leads","Pipeline","Renewals","Policies","Claims","Team","Settings"];

function teamNames(){ var n=S.team.map(function(t){return t.name;}).filter(Boolean); if(!n.length) n=["Prateek","Team"]; return n; }
function leadById(id){ for(var i=0;i<S.leads.length;i++) if(String(S.leads[i].id)===String(id)) return S.leads[i]; return null; }
function upsertLead(row){ if(!row) return; var i=S.leads.findIndex(function(l){return String(l.id)===String(row.id);}); if(i>=0) S.leads[i]=row; else S.leads.unshift(row); }

async function loadAll(){
  S.conn="checking"; render();
  try{
    var res=await Promise.all([
      apiAll("leads?select=*&order=created_at.desc,id.desc",MAX_LEADS,function(n){ S.loadedSoFar=n; var b=document.querySelector(".conn"); if(b) b.lastChild.textContent="Loading "+n.toLocaleString("en-IN")+" leads…"; }),
      apiAll("policies?select=*&order=created_at.desc,id.desc").catch(function(){return [];}),
      apiAll("claims?select=*&order=created_at.desc,id.desc").catch(function(e){ S.claimsMissing=/does not exist|404|PGRST205/.test(e.message); return []; }),
      api("GET","team_members?select=name,role,city,auth_email&order=id").catch(function(){return [];})
    ]);
    S.leads=res[0]||[]; S.policies=res[1]||[]; S.claims=res[2]||[]; S.team=res[3]||[];
    S.conn="ok"; S.leadsCapped=S.leads.length>=MAX_LEADS; S.connMsg="Connected — "+S.leads.length.toLocaleString("en-IN")+" lead(s)"+(S.leadsCapped?" (newest "+MAX_LEADS.toLocaleString("en-IN")+" loaded)":"");
  }catch(e){ S.conn="bad"; S.connMsg=e.message; toast("Could not load from Supabase",true); }
  render();
}

/* ---------------- toast ---------------- */
var toastTimer;
function toast(msg,bad){ var el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); } el.className="toast"+(bad?" bad":""); el.textContent=msg; el.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.style.display="none";},3200); }

/* ---------------- derived lists ---------------- */
function filtered(){
  var q=S.q.toLowerCase().trim(), f=S.f;
  return S.leads.filter(function(l){
    if(q && !((l.name||"").toLowerCase().indexOf(q)>=0 || digits(l.phone).indexOf(q.replace(/\D/g,"")||"~")>=0 || (l.city||"").toLowerCase().indexOf(q)>=0 || (l.reel_source||"").toLowerCase().indexOf(q)>=0)) return false;
    if(f.stage!=="All" && stageOf(l)!==f.stage) return false;
    if(f.priority!=="All" && (l.priority||"Warm")!==f.priority) return false;
    if(f.city!=="All" && (l.city||"")!==f.city) return false;
    if(f.assigned!=="All" && (l.assigned_to||"")!==f.assigned) return false;
    if(f.source!=="All" && (l.reel_source||l.source||"")!==f.source) return false;
    return true;
  });
}
function dueLeads(){ var t=today(); return S.leads.filter(function(l){ return isOpen(l) && (!l.next_followup || l.next_followup<=t); }).sort(function(a,b){ return String(a.next_followup||"").localeCompare(String(b.next_followup||"")) || (PRIORITIES.indexOf(a.priority||"Warm")-PRIORITIES.indexOf(b.priority||"Warm")); }); }
function localDay(ts){ var d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function calledToday(l){ return !!l.last_contacted_at && localDay(l.last_contacted_at)===today(); }
function prospectRenewals(){ return S.leads.filter(function(l){ var d=daysUntil(l.existing_renewal_date); return d!==null && d>=-7 && d<=60 && l.stage!=="Lost"; }).sort(function(a,b){return String(a.existing_renewal_date).localeCompare(String(b.existing_renewal_date));}); }
function policyRenewals(){ return S.policies.filter(function(p){ var d=daysUntil(p.renewal_date); return d!==null && d>=-15 && d<=60 && (p.status||"Active")==="Active"; }).sort(function(a,b){return String(a.renewal_date).localeCompare(String(b.renewal_date));}); }

/* ---------------- rendering ---------------- */
var app=document.getElementById("app");
function render(){
  var scroll=document.querySelector(".drawer")?document.querySelector(".drawer").scrollTop:0;
  if(!S.user){ app.innerHTML=loginView(); return; }
  app.innerHTML='<div class="shell">'+sideView()+'<main class="main">'+topView()+viewBody()+'<footer>TriCity Health Wala CRM • Leads are private to your team • Educational guidance; policy terms &amp; conditions apply</footer></main></div>'+drawerView()+modalView();
  var d=document.querySelector(".drawer"); if(d) d.scrollTop=scroll;
}
function loginView(){
  return '<div class="login"><form class="login-card" data-form="login">'+
    '<div class="brand"><span class="mark">+</span><div><b>TriCity Health Wala</b><small>Chandigarh • Mohali • Panchkula</small></div></div>'+
    '<h1>Welcome back</h1>'+
    '<label class="field">Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" value="'+esc(S.loginEmail||"")+'" required></label>'+
    '<label class="field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Your Supabase password" required></label>'+
    (S.loginErr?'<div class="error" role="alert">'+esc(S.loginErr)+'</div>':"")+
    '<button class="btn primary block" style="margin-top:18px;padding:13px" '+(S.busy?"disabled":"")+'>'+(S.busy?"Logging in…":"Log in →")+'</button>'+
  '</form></div>';
}
function sideView(){
  var due=dueLeads().length, ren=prospectRenewals().length+policyRenewals().length;
  var counts={"Today's Calls":due,"All Leads":S.leads.length,"Renewals":ren,"Policies":S.policies.length,"Claims":S.claims.filter(function(c){return ["Settled","Rejected"].indexOf(c.status)<0;}).length};
  return '<aside class="side" id="side"><div class="brand"><span class="mark">+</span><div><b>TriCity Health Wala</b><small>Chandigarh • Mohali • Panchkula</small></div></div><nav>'+
    VIEWS.map(function(v){ return '<button class="nav'+(S.view===v?" on":"")+'" data-act="view" data-v="'+esc(v)+'"><span>'+esc(v)+'</span>'+(counts[v]?'<span class="count">'+counts[v]+'</span>':"")+'</button>'; }).join("")+
    '</nav><div class="me"><span class="avatar">'+esc(initials(S.user.display))+'</span><div style="flex:1;min-width:0"><b style="color:var(--ink)">'+esc(S.user.display)+'</b><br><small class="muted">'+esc(S.user.role)+'</small></div><button class="btn sm ghost" data-act="logout">Logout</button></div></aside>';
}
function topView(){
  return '<header class="top"><button class="btn menu-btn" data-act="menu">☰</button>'+
    '<label class="search"><span>⌕</span><input data-input="q" value="'+esc(S.q)+'" placeholder="Search name, phone, city or reel…"></label>'+
    '<button class="conn '+(S.conn==="ok"?"ok":S.conn==="bad"?"bad":"")+'" data-act="reload" title="'+esc(S.connMsg)+'"><span class="dot"></span>'+(S.conn==="ok"?"Connected":S.conn==="bad"?"Not connected — retry":"Checking…")+'</button>'+
    '<button class="btn primary" data-act="add-lead">+ Add lead</button></header>';
}
function viewBody(){
  if(S.q && ["All Leads"].indexOf(S.view)<0){ return leadsView(); }
  switch(S.view){
    case "Dashboard": return dashView();
    case "Today's Calls": return callsView();
    case "All Leads": return leadsView();
    case "Pipeline": return pipeView();
    case "Renewals": return renewView();
    case "Policies": return policiesView();
    case "Claims": return claimsView();
    case "Team": return teamView();
    case "Settings": return settingsView();
  }
  return "";
}
function leadRow(l,extra){
  var d=daysUntil(l.next_followup);
  return '<div class="row"><span class="avatar" style="background:var(--card2);color:var(--ink)">'+esc(initials(l.name))+'</span>'+
    '<div class="who" data-act="open" data-id="'+l.id+'"><b>'+esc(l.name)+' <span class="tag '+esc(l.priority||"Warm")+'">'+esc(l.priority||"Warm")+'</span></b>'+
    '<small>'+dash(l.city)+' • '+esc(stageOf(l))+(extra?' • '+extra:(d!==null&&d<0?' • <span class="overdue">'+(-d)+' day(s) overdue</span>':''))+'</small></div>'+
    '<a class="btn sm" href="'+esc(telLink(l.phone))+'">Call</a><a class="btn sm wa" target="_blank" rel="noopener" href="'+esc(waLink(l.whatsapp||l.phone))+'">WA</a></div>';
}
function dashView(){
  var t=today(), weekAgo=addDays(-7);
  var newWeek=S.leads.filter(function(l){return l.created_at && localDay(l.created_at)>=weekAgo;}).length;
  var due=dueLeads(), overdue=due.filter(function(l){return l.next_followup && l.next_followup<t;});
  var active=S.policies.filter(function(p){return (p.status||"Active")==="Active";});
  var ren=policyRenewals().length+prospectRenewals().length;
  var maxStage=Math.max(1,Math.max.apply(null,STAGES.map(function(s){return S.leads.filter(function(l){return stageOf(l)===s;}).length;})));
  var src={}; S.leads.forEach(function(l){ var k=l.reel_source||l.source||"Unknown"; src[k]=(src[k]||0)+1; });
  var srcList=Object.keys(src).sort(function(a,b){return src[b]-src[a];}).slice(0,6), maxSrc=Math.max(1,srcList.length?src[srcList[0]]:1);
  var lost={}; S.leads.filter(function(l){return l.stage==="Lost";}).forEach(function(l){ var k=l.lost_reason||"Not recorded"; lost[k]=(lost[k]||0)+1; });
  var lostList=Object.keys(lost).sort(function(a,b){return lost[b]-lost[a];});
  return '<div class="head"><div><h1>Good '+(new Date().getHours()<12?"morning":new Date().getHours()<17?"afternoon":"evening")+', '+esc(S.user.display)+'</h1><p>'+new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})+'</p></div></div>'+
  '<div class="kpis">'+
    kpi("Calls due",due.length,overdue.length+" overdue","red")+
    kpi("New leads (7 days)",newWeek,S.leads.length+" total","")+
    kpi("Open pipeline",S.leads.filter(isOpen).length,"not sold / lost","blue")+
    kpi("Active policies",active.length,money(active.reduce(function(a,p){return a+(Number(p.premium)||0);},0))+" premium","green")+
    kpi("Renewals (60 days)",ren,"yours + prospects","gold")+
  '</div>'+
  '<div class="cols"><div class="panel"><div class="panel-head"><h3>Call next</h3><button class="btn sm ghost" data-act="view" data-v="Today\'s Calls">See all</button></div>'+
    (due.length?due.slice(0,6).map(function(l){return leadRow(l);}).join(""):'<div class="empty">No calls due. New leads from the landing page appear here automatically.</div>')+
  '</div><div class="panel"><h3>Pipeline</h3>'+
    STAGES.map(function(s){ var n=S.leads.filter(function(l){return stageOf(l)===s;}).length; return '<div class="bar-row"><span>'+esc(s)+'</span><div class="bar"><i style="width:'+(n?Math.max(6,n/maxStage*100):0)+'%"></i></div><b style="color:var(--ink)">'+n+'</b></div>'; }).join("")+
  '</div></div>'+
  '<div class="cols3"><div class="panel"><h3>Where leads come from</h3><p class="muted" style="margin:4px 0 6px;font-size:12px">Add <b>?reel=05</b> to your landing link in each reel caption to track it.</p>'+
    (srcList.length?srcList.map(function(k){return '<div class="bar-row"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+(src[k]/maxSrc*100)+'%;background:var(--gold)"></i></div><b style="color:var(--ink)">'+src[k]+'</b></div>';}).join(""):'<div class="empty">No leads yet</div>')+
  '</div><div class="panel"><h3>Renewing soon</h3>'+
    (prospectRenewals().length?prospectRenewals().slice(0,5).map(function(l){var d=daysUntil(l.existing_renewal_date);return leadRow(l,'<span class="'+(d<=15?"overdue":"")+'">current policy renews in '+d+' day(s)</span>');}).join(""):'<div class="empty">Add "current policy renewal date" on leads to see porting chances here.</div>')+
  '</div><div class="panel"><h3>Why leads were lost</h3>'+
    (lostList.length?lostList.map(function(k){return '<div class="bar-row"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+(lost[k]/Math.max(1,lost[lostList[0]])*100)+'%;background:var(--red)"></i></div><b style="color:var(--ink)">'+lost[k]+'</b></div>';}).join(""):'<div class="empty">No lost leads yet</div>')+
  '</div></div>';
}
function kpi(label,val,small,cls){ return '<div class="kpi '+cls+'"><span>'+esc(label)+'</span><b>'+val+'</b><small>'+small+'</small></div>'; }
function leadCard(l){
  var d=daysUntil(l.next_followup);
  return '<div class="lead" data-act="open" data-id="'+l.id+'">'+
    '<div style="display:flex;justify-content:space-between;gap:6px"><span class="tag '+esc(l.priority||"Warm")+'">'+esc(l.priority||"Warm")+'</span><span class="tag">'+esc(stageOf(l))+'</span></div>'+
    '<h3>'+esc(l.name)+'</h3><div class="meta">'+esc(l.phone)+' • '+dash(l.city)+(l.age?' • '+esc(l.age)+' yrs':"")+'</div>'+
    '<div class="meta">For: '+dash(l.who_is_it_for)+(l.reel_source?' • Reel: '+esc(l.reel_source):"")+'</div>'+
    ((l.conditions&&l.conditions.length)?'<div class="meta" style="color:var(--gold)">⚕ '+esc(l.conditions.join(", "))+'</div>':"")+
    '<div class="foot"><span>Next: <span class="'+(d!==null&&d<0&&isOpen(l)?"overdue":"")+'">'+fmtDate(l.next_followup)+'</span></span><span>'+(l.call_attempts||0)+' call(s) • '+dash(l.assigned_to)+'</span></div>'+
    '<div class="acts"><a class="btn sm" href="'+esc(telLink(l.phone))+'" data-stop="1">Call</a><a class="btn sm wa" target="_blank" rel="noopener" href="'+esc(waLink(l.whatsapp||l.phone))+'" data-stop="1">WhatsApp</a><button class="btn sm gold" data-act="log-call" data-id="'+l.id+'">Log call</button></div>'+
  '</div>';
}
function callsView(){
  var due=dueLeads(), t=today();
  return '<div class="head"><div><h1>Today\'s calls</h1><p>Overdue first, then Hot leads. Log every call so nothing is missed.</p></div></div>'+
    (due.length?'<div class="lead-grid">'+capped(due,leadCard)+'</div>':'<div class="empty">All caught up for today 🎉</div>')+
    (S.leads.filter(calledToday).length?'<h3 class="serif" style="margin:22px 0 10px">Already called today</h3><div class="lead-grid">'+S.leads.filter(calledToday).filter(function(l){return due.indexOf(l)<0;}).slice(0,SHOW_STEP).map(leadCard).join("")+'</div>':"");
}
function capped(list,fn){
  var shown=list.slice(0,S.showN).map(fn).join(""), more=list.length-S.showN;
  return shown+(more>0?'<div class="more-row">Showing '+S.showN.toLocaleString("en-IN")+' of '+list.length.toLocaleString("en-IN")+' <button class="btn" data-act="more">Show '+Math.min(SHOW_STEP,more)+' more</button></div>':"");
}
function leadsView(){
  var list=filtered(), f=S.f;
  var cities=Array.from(new Set(S.leads.map(function(l){return l.city;}).filter(Boolean))).sort();
  var sources=Array.from(new Set(S.leads.map(function(l){return l.reel_source||l.source;}).filter(Boolean))).sort();
  return '<div class="head"><div><h1>All leads</h1><p>'+list.length+' of '+S.leads.length+' shown</p></div><button class="btn ghost" data-act="export">Export CSV</button></div>'+
    '<div class="filters">'+
      '<select data-filter="stage">'+opt(["All"].concat(STAGES),f.stage)+'</select>'+
      '<select data-filter="priority">'+opt(["All"].concat(PRIORITIES),f.priority)+'</select>'+
      '<select data-filter="city">'+opt(["All"].concat(cities),f.city)+'</select>'+
      '<select data-filter="assigned">'+opt(["All"].concat(teamNames()),f.assigned)+'</select>'+
      '<select data-filter="source">'+opt(["All"].concat(sources),f.source)+'</select>'+
      '<button class="btn ghost" data-act="clear-filters">Clear</button></div>'+
    (S.leadsCapped?'<div class="error" style="margin-bottom:12px">You have more than '+MAX_LEADS.toLocaleString("en-IN")+' leads. Only the newest '+MAX_LEADS.toLocaleString("en-IN")+' are loaded here. Older ones are safe in Supabase.</div>':"")+
    (list.length?'<div class="lead-grid">'+capped(list,leadCard)+'</div>':'<div class="empty">No leads match.</div>');
}
function pipeView(){
  return '<div class="head"><div><h1>Pipeline</h1><p>Move leads forward as you talk to them.</p></div></div><div class="kanban">'+
    STAGES.map(function(s,i){ var ls=S.leads.filter(function(l){return stageOf(l)===s;});
      return '<div class="col"><div class="col-h"><b>'+esc(s)+'</b><span class="tag">'+ls.length+'</span></div>'+
        (ls.length?ls.slice(0,50).map(function(l){ return '<div class="kcard"><b data-act="open" data-id="'+l.id+'">'+esc(l.name)+'</b> <span class="tag '+esc(l.priority||"Warm")+'">'+esc(l.priority||"Warm")+'</span><p>'+esc(l.phone)+' • '+dash(l.city)+'</p><p>Next: '+fmtDate(l.next_followup)+'</p>'+
          '<div class="k-acts">'+(i>0&&i<6?'<button class="btn sm" data-act="move" data-id="'+l.id+'" data-to="'+esc(STAGES[i-1])+'">←</button>':"")+
          (i<5?'<button class="btn sm primary" style="flex:1" data-act="move" data-id="'+l.id+'" data-to="'+esc(STAGES[i+1])+'">'+esc(STAGES[i+1])+' →</button>':"")+
          (i===5?'<button class="btn sm primary" style="flex:1" data-act="sold" data-id="'+l.id+'">Policy sold</button>':"")+
          (i>=6?'<button class="btn sm" style="flex:1" data-act="move" data-id="'+l.id+'" data-to="Follow-up">Reopen</button>':"")+
          '</div></div>'; }).join("")+(ls.length>50?'<div class="empty" style="padding:12px;font-size:12px">+'+(ls.length-50).toLocaleString("en-IN")+' more. Use All Leads → stage filter.</div>':""):'<div class="empty" style="padding:16px;font-size:12px">Empty</div>')+'</div>'; }).join("")+'</div>';
}
function renewView(){
  var pr=policyRenewals(), ld=prospectRenewals();
  function dTag(d){ return '<span class="tag '+(d<0?"bad":d<=15?"warn":"ok")+'">'+(d<0?(-d)+" days ago":d===0?"today":"in "+d+" days")+'</span>'; }
  return '<div class="head"><div><h1>Renewals</h1><p>Next 60 days. Remind early — renewals are your easiest wins.</p></div></div>'+
  '<div class="panel"><h3>Your clients\' policies</h3>'+(pr.length?'<div class="table-wrap" style="margin-top:10px;border:0"><table><tr><th>Client</th><th>Insurer / plan</th><th>Sum insured</th><th>Premium</th><th>Renewal</th><th></th></tr>'+
    pr.map(function(p){ var l=leadById(p.lead_id)||{}; var d=daysUntil(p.renewal_date); var msg="Namaste "+(p.client||l.name||"")+" ji, aapki "+(p.company||"health")+" policy "+fmtPlain(p.renewal_date)+" ko renew honi hai. Koi bhi sawaal ho toh bataiye. — TriCity Health Wala";
      return '<tr><td><b style="color:var(--ink)">'+dash(p.client)+'</b><br><small class="muted">'+dash(p.policy_no)+'</small></td><td>'+dash(p.company)+'<br><small class="muted">'+dash(p.plan_name)+'</small></td><td>'+money(p.sum_insured)+'</td><td>'+money(p.premium)+'</td><td>'+fmtDate(p.renewal_date)+'<br>'+dTag(d)+'</td><td>'+(l.phone?'<a class="btn sm wa" target="_blank" rel="noopener" href="'+esc(waLink(l.whatsapp||l.phone,msg))+'">Remind</a>':"")+'</td></tr>'; }).join("")+'</table></div>':'<div class="empty" style="margin-top:10px">No policy renewals in the next 60 days.</div>')+'</div>'+
  '<div class="panel" style="margin-top:14px"><h3>Prospects whose current policy renews soon</h3><p class="muted" style="margin:4px 0 0;font-size:12px">Best time to review their cover. Porting keeps waiting-period credit — check the new insurer\'s rules.</p>'+
    (ld.length?capped(ld,function(l){ return leadRow(l,dTag(daysUntil(l.existing_renewal_date))+' '+dash(l.existing_insurer)); }):'<div class="empty" style="margin-top:10px">None yet.</div>')+'</div>';
}
function fmtPlain(ds){ if(!ds) return ""; var d=new Date(String(ds).slice(0,10)+"T00:00:00"); return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}); }
function policiesView(){
  return '<div class="head"><div><h1>Policies</h1><p>Real policy records — added when you mark a lead as sold.</p></div><button class="btn primary" data-act="new-policy">+ Add policy</button></div>'+
    (S.policies.length?'<div class="table-wrap"><table><tr><th>Policy no.</th><th>Client</th><th>Insurer / plan</th><th>Members</th><th>Sum insured</th><th>Premium</th><th>Start</th><th>Renewal</th><th>Waiting ends</th><th>Status</th></tr>'+
    S.policies.map(function(p){ return '<tr class="click" data-act="edit-policy" data-id="'+p.id+'"><td>'+dash(p.policy_no)+'</td><td><b style="color:var(--ink)">'+dash(p.client)+'</b></td><td>'+dash(p.company)+'<br><small class="muted">'+dash(p.plan_name)+'</small></td><td>'+dash(p.members_covered)+'</td><td>'+money(p.sum_insured)+'</td><td>'+money(p.premium)+'<br><small class="muted">'+dash(p.premium_mode)+'</small></td><td>'+fmtDate(p.issue_date)+'</td><td>'+fmtDate(p.renewal_date)+'</td><td>'+fmtDate(p.waiting_period_end)+'</td><td><span class="tag '+((p.status||"Active")==="Active"?"ok":"bad")+'">'+esc(p.status||"Active")+'</span></td></tr>'; }).join("")+'</table></div>':'<div class="empty">No policies yet. Open a lead and click "Policy sold" to add one.</div>');
}
function claimsView(){
  if(S.claimsMissing) return '<div class="head"><div><h1>Claims</h1></div></div><div class="error">The claims table is not set up yet. Run <b>supabase_update_v2.sql</b> in Supabase → SQL Editor, then click Connected/Retry at the top.</div>';

/* ---------------- actions ---------------- */
function noteLine(text){ return nowStamp()+" · "+(S.user?S.user.display:"")+" — "+text; }
function prependNote(l,text){ return [noteLine(text)].concat(noteLines(l.notes)).join("\n").slice(0,20000); }
async function patchLead(id,body,okMsg){
  try{ var rows=await api("PATCH","leads?id=eq."+encodeURIComponent(id),body,"return=representation"); if(rows&&rows[0]) upsertLead(rows[0]); if(okMsg) toast(okMsg); render(); return true; }
  catch(e){ console.warn(e); toast(e.message,true); return false; }
}
function formData(form){ var fd=new FormData(form), o={}; fd.forEach(function(v,k){ if(o[k]!==undefined){ if(!Array.isArray(o[k])) o[k]=[o[k]]; o[k].push(v); } else o[k]=v; }); return o; }
function asArr(v){ return v===undefined?[]:Array.isArray(v)?v:[v]; }

  var kind=form.getAttribute("data-form"), id=form.getAttribute("data-id"), d=formData(form), l=id?leadById(id):null;
  var btn=form.querySelector("button:not([type=button])"); if(btn) btn.disabled=true;
  try{
  if(kind==="login"){
    S.busy=true; S.loginErr=""; S.loginEmail=String(d.email||"").trim(); render();
    try{
      if(!C.anonKey||C.anonKey.indexOf("PASTE_")===0) throw new Error("Setup needed: paste your Supabase anon key at the top of this file.");
      var x=await authPost("token?grant_type=password",{email:String(d.email).trim(),password:d.password});
      var mem; try{ mem=await findMember(x.access_token,String(d.email).trim()); }catch(e){ authPost("logout",{},x.access_token).catch(function(){}); throw e; }
      x.member=mem; applyS(x); saveS(x); S.user=toUser(mem); S.busy=false; toast("Welcome, "+S.user.display); await loadAll();
    }catch(e){ S.busy=false; S.loginErr=e.message; render(); }
    return;
  }
  if(kind==="quick"){
    var body={stage:d.stage,priority:d.priority,assigned_to:str(d.assigned_to),next_followup:str(d.next_followup)};
    var changes=[]; if(body.stage!==stageOf(l)) changes.push("Stage → "+body.stage); if(body.assigned_to!==l.assigned_to) changes.push("Assigned → "+(body.assigned_to||"—")); if(body.next_followup!==l.next_followup) changes.push("Next call → "+(body.next_followup||"—"));
    if(changes.length) body.notes=prependNote(l,changes.join(", "));
    await patchLead(id,body,"Saved ✓"); return;
  }
  if(kind==="note"){
    var t=String(d.note||"").trim(); if(!t){ return; }
    await patchLead(id,{notes:prependNote(l,t)},"Note added ✓"); return;
  }
  if(kind==="details"){
    var rel=asArr(d.m_relation), ages=asArr(d.m_age), members=[];
    rel.forEach(function(r,i){ var a=num(ages[i]); if(r||a!==null) members.push({relation:r||"Member",age:a}); });
    var b={name:str(d.name),phone:str(d.phone),whatsapp:str(d.whatsapp),email:str(d.email),city:str(d.city),age:num(d.age),who_is_it_for:str(d.who_is_it_for),
      best_time:str(d.best_time),language:str(d.language),referred_by:str(d.referred_by),members:members,conditions:asArr(d.conditions),conditions_note:str(d.conditions_note),smoker:str(d.smoker),
      existing_policy:str(d.existing_policy),existing_insurer:str(d.existing_insurer),existing_sum_insured:num(d.existing_sum_insured),existing_renewal_date:str(d.existing_renewal_date),
      existing_since_year:num(d.existing_since_year),employer_cover:str(d.employer_cover),preferred_hospital:str(d.preferred_hospital),sum_insured:num(d.sum_insured),budget:num(d.budget),reel_source:str(d.reel_source)};
    if(!b.name||!b.phone){ toast("Name and phone are required",true); return; }
    await patchLead(id,b,"Details saved ✓"); return;
  }
  if(kind==="add-lead"){
    var ph=digits(d.phone); if(String(d.name||"").trim().length<2||ph.length<10){ toast("Please add a name and a 10-digit phone",true); return; }
    var nb={name:String(d.name).trim(),phone:ph,whatsapp:ph,city:str(d.city),age:num(d.age),who_is_it_for:str(d.who_is_it_for),source:d.source,priority:d.priority,assigned_to:str(d.assigned_to),
      referred_by:str(d.referred_by),next_followup:str(d.next_followup),stage:"New Lead",consent:!!d.consent,consent_at:d.consent?new Date().toISOString():null,
      notes:noteLine("Lead added ("+d.source+")"+(d.note?": "+String(d.note).trim():""))};
    var rows=await api("POST","leads",nb,"return=representation"); if(rows&&rows[0]) upsertLead(rows[0]);
    S.modal=null; toast("Lead saved ✓"); render(); return;
  }
  if(kind==="log-call"){
    var txt="Call #"+((l.call_attempts||0)+1)+": "+d.outcome+(d.note?" — "+String(d.note).trim():"");
    var cb={call_attempts:(l.call_attempts||0)+1,last_contacted_at:new Date().toISOString(),next_followup:str(d.next_followup),stage:d.stage,notes:prependNote(l,txt)};
    if(d.stage==="New Lead" && d.outcome==="Connected") cb.stage="Contacted";
    if(d.outcome==="Wrong number"){ cb.stage="Lost"; cb.lost_reason="Wrong number"; }
    var ok=await patchLead(id,cb,"Call logged ✓"); if(ok){ S.modal=null; render(); } return;
  }
  if(kind==="lost"){
    var ok2=await patchLead(id,{stage:"Lost",lost_reason:d.lost_reason,notes:prependNote(l,"Marked lost: "+d.lost_reason+(d.note?" — "+String(d.note).trim():""))},"Marked as lost"); if(ok2){ S.modal=null; render(); } return;
  }
  if(kind==="policy"){
    var pid=form.getAttribute("data-id"), leadId=form.getAttribute("data-lead")||d.lead_id;
    if(!leadId){ toast("Choose the customer",true); return; }
    var start=str(d.issue_date), ren=str(d.renewal_date);
    if(!ren && start){ var pr=start.split("-").map(Number); var dt=new Date(Date.UTC(pr[0]+1,pr[1]-1,pr[2]-1)); ren=dt.toISOString().slice(0,10); }
    var pb={lead_id:Number(leadId),client:str(d.client)||((leadById(leadId)||{}).name)||null,policy_no:str(d.policy_no),company:str(d.company),plan_name:str(d.plan_name),sum_insured:num(d.sum_insured),premium:num(d.premium),premium_mode:d.premium_mode,
      commission:num(d.commission),issue_date:start,renewal_date:ren,waiting_period_end:str(d.waiting_period_end),nominee:str(d.nominee),assigned_to:str(d.assigned_to),status:d.status,members_covered:str(d.members_covered)};
    var saved;
    if(pid){ saved=await api("PATCH","policies?id=eq."+encodeURIComponent(pid),pb,"return=representation"); }
    else { saved=await api("POST","policies",pb,"return=representation"); }
    if(saved&&saved[0]){ var i=S.policies.findIndex(function(p){return String(p.id)===String(saved[0].id);}); if(i>=0) S.policies[i]=saved[0]; else S.policies.unshift(saved[0]); }
    var ld2=leadById(leadId);
    if(!pid && ld2 && ld2.stage!=="Policy Sold"){ await patchLead(leadId,{stage:"Policy Sold",notes:prependNote(ld2,"Policy sold: "+(pb.company||"")+" "+(pb.plan_name||"")+(pb.premium?" • ₹"+pb.premium:""))}); }
    S.modal=null; toast(pid?"Policy updated ✓":"Policy saved 🎉"); render(); return;
  }
  if(kind==="claim"){
    var cid=form.getAttribute("data-id");
    var clb={lead_id:num(d.lead_id),policy_id:num(d.policy_id),patient_name:str(d.patient_name),hospital:str(d.hospital),admission_date:str(d.admission_date),claim_type:d.claim_type,
      amount_claimed:num(d.amount_claimed),amount_approved:num(d.amount_approved),tpa:str(d.tpa),status:d.status,notes:str(d.notes)};
    var sv=cid?await api("PATCH","claims?id=eq."+encodeURIComponent(cid),clb,"return=representation"):await api("POST","claims",clb,"return=representation");
    if(sv&&sv[0]){ var j=S.claims.findIndex(function(c){return String(c.id)===String(sv[0].id);}); if(j>=0) S.claims[j]=sv[0]; else S.claims.unshift(sv[0]); }
    S.modal=null; toast("Claim saved ✓"); render(); return;
  }
  }catch(e){ console.warn(e); toast(e.message,true); }
  finally{ if(btn&&document.body.contains(btn)) btn.disabled=false; }
}
function toUser(m){ var n=(m&&m.name)||"Team"; return {display:n,role:(m&&m.role)||"Team Member"}; }

function exportCsv(){
  var cols=["id","created_at","name","phone","whatsapp","email","city","age","who_is_it_for","members","conditions","conditions_note","smoker","existing_policy","existing_insurer","existing_sum_insured","existing_renewal_date","existing_since_year","employer_cover","preferred_hospital","sum_insured","budget","source","reel_source","referred_by","stage","priority","assigned_to","next_followup","call_attempts","last_contacted_at","lost_reason","consent","consent_at","notes"];
  function cell(v){ if(v===null||v===undefined) return ""; if(typeof v==="object") v=JSON.stringify(v); v=String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }
  var csv=[cols.join(",")].concat(S.leads.map(function(l){return cols.map(function(c){return cell(l[c]);}).join(",");})).join("\n");
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="leads-"+today()+".csv"; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

/* ---------------- events ---------------- */
document.addEventListener("submit",function(e){ var f=e.target.closest("form[data-form]"); if(!f) return; e.preventDefault(); onSubmit(f); });
document.addEventListener("click",function(e){
  var stop=e.target.closest("[data-stop]"); if(stop) { e.stopPropagation(); return; }
  var el=e.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  if(act==="close-bg"){ if(e.target===el){ S.open=null; render(); } return; }
  if(act==="close-modal-bg"){ if(e.target===el){ S.modal=null; render(); } return; }
  if(el.tagName==="A") return;
  e.preventDefault();
  switch(act){
    case "view": S.view=el.getAttribute("data-v"); S.q=""; S.showN=SHOW_STEP; document.getElementById("side")&&document.getElementById("side").classList.remove("open"); render(); window.scrollTo(0,0); break;
    case "menu": document.getElementById("side").classList.toggle("open"); break;
    case "logout": var s=session; session=null; clearS(); clearTimeout(timer); S.user=null; S.leads=[]; S.policies=[]; S.claims=[]; S.open=null; S.modal=null; if(s) authPost("logout",{},s.access_token).catch(function(){}); render(); break;
    case "reload": loadAll(); break;
    case "open": S.open=id; render(); break;
    case "close": S.open=null; render(); break;
    case "close-modal": S.modal=null; render(); break;
    case "add-lead": S.modal={type:"add-lead"}; render(); break;
    case "log-call": S.modal={type:"log-call",id:id}; render(); break;
    case "lost": S.modal={type:"lost",id:id}; render(); break;
    case "sold": S.modal={type:"policy",lead:id,mark:true}; render(); break;
    case "new-policy": S.modal={type:"policy",lead:el.getAttribute("data-lead")||null}; render(); break;
    case "edit-policy": S.modal={type:"policy",policy:S.policies.find(function(p){return String(p.id)===String(id);})}; render(); break;
    case "new-claim": S.modal={type:"claim",lead:el.getAttribute("data-lead")||null}; render(); break;
    case "edit-claim": S.modal={type:"claim",claim:S.claims.find(function(c){return String(c.id)===String(id);})}; render(); break;
    case "move": var l=leadById(id); if(l) patchLead(id,{stage:el.getAttribute("data-to"),notes:prependNote(l,"Stage → "+el.getAttribute("data-to"))},"Moved to "+el.getAttribute("data-to")); break;
    case "clear-filters": S.f={stage:"All",priority:"All",city:"All",assigned:"All",source:"All"}; S.q=""; S.showN=SHOW_STEP; render(); break;
    case "export": exportCsv(); break;
    case "more": S.showN+=SHOW_STEP; render(); break;
    case "add-member": var box=document.getElementById("members"); if(box) box.insertAdjacentHTML("beforeend",memberRow({})); break;
    case "del-member": var row=el.closest(".member"); if(row) row.remove(); break;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("[data-filter]")){ S.f[t.getAttribute("data-filter")]=t.value; S.showN=SHOW_STEP; render(); return; }
  if(t.matches("[data-doc]")){
    var id=t.getAttribute("data-id"), l=leadById(id); if(!l) return;
    var docs=Object.assign({},(l.docs&&typeof l.docs==="object")?l.docs:{}); docs[t.getAttribute("data-doc")]=t.checked;
    patchLead(id,{docs:docs},t.checked?t.getAttribute("data-doc")+" received ✓":"Updated");
  }
});
var qTimer;
document.addEventListener("input",function(e){
  if(e.target.matches("[data-input=q]")){ var v=e.target.value; clearTimeout(qTimer); qTimer=setTimeout(function(){ S.q=v; S.showN=SHOW_STEP; render(); var i=document.querySelector("[data-input=q]"); if(i){ i.focus(); i.setSelectionRange(v.length,v.length);} },250); }
});
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(S.modal){S.modal=null;render();} else if(S.open){S.open=null;render();} } });

/* ---------------- start ---------------- */
(async function(){
  var x=loadS();
  if(x&&x.refresh_token){ try{ x=await refreshS(x.refresh_token,x.member); S.user=toUser(x.member); }catch(e){ clearS(); } }
  render();
  if(S.user) loadAll();
})();
})();
</script>
