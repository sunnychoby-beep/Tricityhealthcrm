:root{
  --teal:#14B8A6;
  --navy:#0F172A;
  --gold:#F59E0B;
  --bg:#0B1220;
  --surface:#16203A;
  --card:#1E293B;
  --ink:#FFFFFF;
  --body:#E2E8F0;
  --muted:#94A3B8;
  --line:#334155;
  --red:#FCA5A5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  color-scheme:dark
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Manrope,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink)
}

button,input,select,textarea{
  font:inherit
}

a{
  color:inherit;
  text-decoration:none
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  display:flex;
  background:var(--bg)
}

.sidebar{
  width:272px;
  flex:0 0 272px;
  background:var(--navy);
  color:#fff;
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:var(--safe-area-inset-top);
  height:calc(100vh - var(--safe-area-inset-top));
  overflow:auto
}

.logo{
  display:flex;
  gap:11px;
  align-items:center;
  margin-bottom:28px
}

.logo-mark{
  width:42px;
  height:42px;
  background:var(--teal);
  border-radius:13px;
  display:grid;
  place-items:center;
  color:#fff
}

.logo b{
  font-family:Fraunces,serif;
  font-size:19px;
  line-height:1.1
}

.logo small{
  display:block;
  color:#9FB1C2;
  font-size:11px;
  margin-top:3px
}

.side-label{
  font-size:11px;
  letter-spacing:.16em;
  color:#8EA6BA;
  margin:0 10px 10px
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#DCE6EE;
  padding:11px 10px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  cursor:pointer;
  font-weight:700
}

.nav-btn.active{
  background:var(--teal);
  color:#fff
}

.nav-btn svg:last-child{
  margin-left:auto
}

.coach{
  background:#173A5A;
  border-radius:14px;
  padding:16px;
  margin-top:18px
}

.coach p{
  font-size:13px;
  line-height:1.5;
  color:#C8D6E1
}

.owner-mini{
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:10px;
  border-top:1px solid #244561;
  padding-top:15px
}

.owner-mini small{
  display:block;
  color:#9FB1C2
}

.live{
  font-size:10px;
  color:#8EE6B5;
  margin-left:auto
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#D9EFEA;
  color:#0A5A4F;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:0 0 38px
}

.avatar.lg{
  background:var(--gold);
  color:#2A2200
}

.avatar.sm{
  width:36px;
  height:36px;
  flex-basis:36px
}

.avatar.xl{
  width:56px;
  height:56px;
  flex-basis:56px
}

.main{
  flex:1;
  min-width:0;
  padding:20px 26px 30px
}

.topbar{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
  flex-wrap:wrap
}

.search{
  flex:1;
  min-width:210px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 15px;
  gap:9px
}

.search input{
  border:0;
  outline:0;
  width:100%
}

.team-tabs{
  display:flex;
  background:#E0E9E7;
  padding:4px;
  border-radius:999px
}

.tab{
  border:0;
  background:transparent;
  padding:8px 13px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer
}

.tab.active{
  background:var(--navy);
  color:#fff
}

.add-btn{
  border:0;
  background:var(--teal);
  color:#fff;
  border-radius:999px;
  padding:12px 18px;
  font-weight:800;
  display:flex;
  gap:7px;
  align-items:center;
  cursor:pointer;
  box-shadow:0 6px 16px #0A7A6B30
}

.mobile-menu{
  display:none
}

.banner{
  background:linear-gradient(100deg,var(--teal),#0F6F72);
  color:#fff;
  border-radius:20px;
  padding:22px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px
}

.banner h2{
  font-family:Fraunces,serif;
  font-size:27px;
  margin:10px 0 5px
}

.banner p{
  opacity:.9;
  margin:0
}

.pill{
  background:#FFDE68;
  color:#292100;
  font-size:11px;
  font-weight:900;
  padding:6px 9px;
  border-radius:999px
}

.banner button{
  border:0;
  background:#fff;
  color:#084F44;
  border-radius:999px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap
}

.greeting{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:24px 0 16px
}

.greeting h1{
  font-family:Fraunces,serif;
  font-size:36px;
  margin:5px 0
}

.greeting p{
  color:var(--muted);
  margin:0
}

.eyebrow{
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900;
  color:var(--teal)
}

.greeting-card{
  display:flex;
  gap:10px;
  background:#FFF8D8;
  border:1px solid #F0D97F;
  padding:12px 14px;
  border-radius:13px
}

.greeting-card small{
  display:block;
  color:var(--muted)
}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.kpi{
  background:#fff;
  border-radius:16px;
  padding:18px;
  position:relative;
  overflow:hidden;
  border:1px solid #E5ECEA
}

.kpi span{
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--muted)
}

.kpi b{
  display:block;
  font-size:32px;
  margin:9px 0 4px
}

.kpi small{
  color:var(--muted)
}

.kpi i{
  position:absolute;
  right:13px;
  top:13px;
  font-style:normal;
  font-size:25px
}

.kpi.teal{
  border-top:5px solid var(--teal)
}

.kpi.navy{
  border-top:5px solid var(--navy)
}

.kpi.gold{
  border-top:5px solid var(--gold)
}

.grid2{
  display:grid;
  grid-template-columns:1.65fr .9fr;
  gap:16px;
  margin-top:16px
}

.panel{
  background:#fff;
  border-radius:18px;
  padding:20px;
  border:1px solid #E5ECEA
}

.panel-head,.section-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:16px
}

.panel h3,.section-head h1{
  margin:0;
  font-family:Fraunces,serif
}

.panel-head p,.section-head p{
  color:var(--muted);
  margin:5px 0 0
}

.text-btn,.open-link{
  border:0;
  background:none;
  color:var(--teal);
  font-weight:800;
  cursor:pointer
}

.call-list{
  margin-top:16px
}

.call-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-top:1px solid #EEF3F2
}

.person{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0
}

.person b{
  display:block
}

.person small,.person p{
  color:var(--muted);
  font-size:13px;
  margin:2px 0
}

.person em{
  color:var(--red);
  font-style:normal
}

.check{
  width:27px;
  height:27px;
  border:2px solid #B9C9C5;
  background:#fff;
  border-radius:7px;
  cursor:pointer;
  color:var(--teal);
  font-weight:900
}

.mini{
  padding:8px 11px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  display:flex;
  gap:5px;
  align-items:center
}

.mini.call{
  background:#E8F5F2;
  color:#0A5A4F
}

.mini.wa{
  background:#E7F7EA;
  color:#176838
}

.mini.ghost{
  background:#EEF2F1
}

.overdue{
  background:#FDECEA;
  color:#7E221B;
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
  font-size:13px
}

.funnel-row{
  display:grid;
  grid-template-columns:110px 1fr 28px;
  align-items:center;
  gap:9px;
  margin-top:11px;
  font-size:13px
}

.bar{
  height:10px;
  background:#EDF3F2;
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--teal);
  border-radius:99px
}

.full{
  width:100%;
  margin-top:18px;
  background:var(--navy);
  color:#fff;
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;

  justify-content:center;
  gap:7px

.section-head{
  margin:8px 0 20px
}

.section-head h1{
  font-size:34px
}

.script{
  background:#FFF8D8;
  padding:13px 16px;
  border-radius:12px
}

.today-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

.today-card{

.today-top{

  justify-content:space-between

.priority{

.priority.hot{
  background:#FDE6E3;
  color:#A52E24
}

.priority.warm{
  background:#FFF0C9;
  color:#705D00
}

.priority.cold{
  background:#E8EFF5;
  color:#335A78
}

.stage-tag{
  background:#E9F1EF;
  color:#31594F;
  padding:6px 9px;
  border-radius:99px;
  font-size:12px;
  font-weight:800
}

.stage-tag.big{
  font-size:13px
}

.person.big{

}

.person.big h3{
  margin:0
}

.need{
  font-size:14px
}

.actions{
  display:flex;
  gap:9px;
  margin:14px 0
}

.actions a{
  flex:1;
  height:46px;

  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:11px;
  background:var(--teal);
  color:#fff;
  font-weight:800
}

.actions a.wa{
  background:#1FA855
}

.done-row{
  display:flex;
  align-items:center;
  gap:8px;
  background:#F3F7F6;
  padding:10px;
  border-radius:10px
}

.done-row button{
  margin-left:auto;
  border:0;
  background:var(--navy);
  color:#fff;
  padding:8px 10px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer
}

.field{
  display:grid;
  gap:6px;
  font-size:13px;
  font-weight:800;
  margin-top:12px
}

.field input,.field select,select{
  border:1px solid #CAD6D2;
  border-radius:9px;
  padding:10px;
  background:#fff
}

.field button{
  border:0;
  background:#E9F1EF;
  padding:9px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer
}

.note-row{
  display:flex;
  gap:8px;
  margin-top:10px
}

.note-row input{
  flex:1;
  border:1px solid #CAD6D2;
  border-radius:9px;
  padding:10px
}

.note-row button{
  border:0;
  background:var(--gold);
  font-weight:900;
  padding:0 13px;
  border-radius:9px;
  cursor:pointer
}

.open-link{
  margin-top:13px;
  padding:0
}

.empty{
  background:#fff;
  padding:40px;
  border-radius:16px;
  text-align:center
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
  align-items:end
}

.filters label{
  font-size:12px;
  font-weight:800;
  display:grid;
  gap:5px
}

.clear{
  border:0;
  background:#E9F1EF;
  padding:11px 13px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer
}

.lead-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.lead-card{
  background:#fff;
  border-radius:16px;
  padding:17px;
  border:1px solid #E5ECEA;
  cursor:pointer
}

.card-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  font-weight:800
}

.lead-card h3{
  margin:12px 0 3px;
  font-family:Fraunces,serif
}

.phone{
  margin:0
}

.meta{
  font-size:13px;
  color:var(--muted);
  margin:6px 0
}

.card-foot{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #EDF3F2;
  padding-top:11px;
  font-size:12px
}

.red{
  color:var(--red)
}

.card-actions{
  display:flex;
  gap:7px;
  margin-top:12px
}

.card-actions a{
  flex:1;
  background:#E8F5F2;
  color:#0A5A4F;
  text-align:center;
  padding:9px;
  border-radius:9px;
  font-weight:800;
  font-size:13px;
  display:flex;
  gap:5px;
  justify-content:center
}

.card-actions span{
  color:var(--teal);
  font-weight:800;
  font-size:13px;
  align-self:center
}

.kanban{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px
}

.column{
  min-width:200px;
  background:#EAF0EF;
  border-radius:14px;
  padding:11px
}

.col-head{
  display:flex;
  justify-content:space-between
}

.col-head span{
  background:var(--navy);
  color:#fff;
  border-radius:99px;
  padding:2px 8px;
  font-size:12px
}

.column>small{
  color:var(--muted)
}

.kan-card{
  background:#fff;
  border-radius:11px;
  padding:11px;
  margin-top:10px
}

.kan-card p{
  font-size:12px;
  color:var(--muted);
  margin:4px 0
}

.kan-actions{
  display:grid;
  gap:6px;
  margin-top:9px
}

.kan-actions button{
  border:0;
  background:var(--teal);
  color:#fff;
  border-radius:8px;
  padding:8px;
  font-weight:800;
  cursor:pointer
}

.kan-actions .lost{
  background:#FDECEA;
  color:#9E2E25
}

.kan-actions .ghost2{
  background:#EDF2F1;
  color:var(--navy)
}

.col-empty{
  font-size:12px;
  color:var(--muted);
  padding:20px 0;
  text-align:center
}

.table-wrap{
  background:#fff;
  border-radius:16px;
  overflow:auto;
  border:1px solid #E5ECEA
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:840px
}

th{
  text-align:left;
  padding:14px;
  color:var(--muted);
  font-size:12px
}

td{
  padding:14px;
  border-top:1px solid #EDF3F2;
  font-size:14px
}

.green{
  color:#16724F;
  font-weight:800
}

.note-box{
  background:#FFF8D8;
  padding:13px;
  border-radius:12px;
  margin-top:12px
}

.renew-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.renew-card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  display:flex;
  gap:14px;
  align-items:center
}

.days{
  width:68px;
  height:68px;
  background:#FFF0C9;
  border-radius:50%;
  display:grid;
  place-content:center;
  text-align:center;
  flex:0 0 68px
}

.days b{
  display:block;
  font-size:24px;
  line-height:1
}

.days span{
  font-size:10px
}

.renew-card h3{
  margin:0
}

.renew-card p{
  font-size:13px;
  color:var(--muted);
  margin:4px 0
}

.renew-card a{
  margin-left:auto;
  background:var(--teal);
  color:#fff;
  padding:10px 14px;
  border-radius:99px;
  display:flex;
  gap:6px;
  font-weight:800
}

.auto{
  background:#E8F5F2;
  padding:14px;
  border-radius:12px;
  margin-top:14px;
  display:flex;
  gap:9px
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.team-card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  text-align:center
}

.team-card h3{
  margin:10px 0 2px
}

.team-card p{
  color:var(--muted);
  margin:0
}

.team-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid #EDF3F2;
  margin:16px 0;
  padding-top:16px
}

.team-stats b{
  display:block;
  font-size:24px
}

.team-stats span{
  font-size:12px;
  color:var(--muted)
}

.team-card label{
  font-size:12px;
  color:var(--muted)
}

.team-card label button{
  display:block;
  margin:7px auto 0;
  border:0;
  background:#E9F1EF;
  padding:8px 11px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer
}

.settings-grid{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:16px
}

.settings ol{
  line-height:1.8
}

.muted{
  color:var(--muted)
}

.status{
  background:#E8F5F2;
  padding:10px;
  border-radius:9px
}

.settings textarea{
  width:100%;
  height:180px;
  border:1px solid #CAD6D2;
  border-radius:10px;
  padding:12px;
  font-family:monospace;
  font-size:12px
}

.fields{
  display:grid;
  gap:7px;
  font-size:13px;
  margin-top:12px
}

.fields span{
  background:#F3F7F6;
  padding:9px;
  border-radius:8px
}

footer{
  text-align:center;
  color:#8A9A96;
  font-size:12px;
  margin-top:28px
}

.overlay{
  position:fixed;
  inset:0;
  background:#0F2A4A99;
  z-index:50;
  display:flex;
  justify-content:flex-end
}

.drawer{
  background:#fff;
  width:min(620px,100%);
  height:100%;
  overflow:auto;
  padding:26px;
  position:relative
}

.close{
  position:absolute;
  right:16px;
  top:16px;
  border:0;
  background:#EDF2F1;
  border-radius:50%;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  cursor:pointer
}

.drawer-head{
  display:flex;
  gap:14px;
  align-items:center
}

.drawer-head h2{
  margin:0;
  font-family:Fraunces,serif
}

.drawer-head p{
  color:var(--muted);
  margin:4px 0
}

.drawer-actions{
  display:flex;
  gap:10px;
  margin:20px 0
}

.drawer-actions a{
  flex:1;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:11px;
  background:var(--teal);
  color:#fff;
  font-weight:800
}

.drawer-actions a.wa{
  background:#1FA855
}

.drawer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.drawer-grid>div,.docs,.timeline{
  background:#F6F9F8;
  border-radius:12px;
  padding:14px
}

.drawer h4{
  margin:20px 0 10px
}

.docs{
  display:grid;
  grid-template-columns:1fr 1fr
}

.docs label{
  display:flex;
  gap:8px;
  align-items:center;
  padding:7px 0
}

.docs span{
  margin-left:auto;
  font-size:12px;
  color:var(--muted)
}

.timeline>div{
  display:flex;
  gap:10px;
  padding:7px 0
}

.timeline p{
  margin:2px 0
}

.drawer-foot{
  display:grid;
  gap:8px;
  margin-top:18px
}

.drawer-foot button{
  border:0;
  background:var(--navy);
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer
}

.drawer-foot .sold{
  background:var(--teal)
}

.drawer-foot .lost{
  background:#FDECEA;
  color:#9E2E25
}

.modal{
  background:#fff;
  margin:auto;
  width:min(680px,calc(100% - 24px));
  border-radius:20px;
  padding:26px;
  position:relative;
  max-height:92vh;
  overflow:auto
}

.modal h2{
  font-family:Fraunces,serif;
  margin:8px 0
}

.steps{
  display:flex;
  gap:8px;
  margin:14px 0
}

.steps span{
  padding:7px 11px;
  border-radius:99px;
  background:#EDF2F1;
  font-size:12px;
  font-weight:800
}

.steps span.on{
  background:#D9EFEA;
  color:#0A5A4F
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px
}

.assign-note{
  background:#FFF8D8;
  padding:12px;
  border-radius:10px
}

.modal-foot{
  display:flex;
  justify-content:space-between;
  margin-top:20px
}

.primary{
  border:0;
  background:var(--teal);
  color:#fff;
  padding:13px 20px;
  border-radius:999px;
  font-weight:900;
  cursor:pointer
}

.ghost-btn{
  border:0;
  background:#EDF2F1;
  padding:12px 16px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer
}

.small-modal{
  background:#fff;
  margin:auto;
  width:min(420px,calc(100% - 24px));
  border-radius:18px;
  padding:24px
}

.small-modal>div{
  display:flex;
  gap:10px;
  margin-top:16px
}

.small-modal button{
  flex:1;
  border:0;
  background:#EDF2F1;
  padding:11px;
  border-radius:9px;
  font-weight:800;
  cursor:pointer
}

.small-modal .danger{
  background:#C43A2E;
  color:#fff
}

.small-modal select{
  width:100%;
  margin-top:10px
}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:22px;
  background:var(--navy);
  color:#fff;
  padding:12px 18px;
  border-radius:999px;
  z-index:100;
  font-weight:800;
  box-shadow:0 10px 30px #0003
}

@media(max-width:900px){
  .sidebar{
    position:fixed;
    left:-300px;
    z-index:60;
    transition:.2s
  }

  .sidebar.open{
    left:0
  }

  .mobile-menu{
    display:block;
    border:1px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:10px
  }

  .kpis{
    grid-template-columns:1fr 1fr
  }

  .grid2,.today-grid,.lead-grid,.renew-grid,.team-grid,.settings-grid{
    grid-template-columns:1fr
  }

  .banner{
    flex-direction:column;
    align-items:start
  }

  .kanban{
    grid-template-columns:repeat(7,220px)
  }

  .main{
    padding:14px
  }

  .topbar{
    flex-wrap:wrap
  }

  .team-tabs{
    order:3;
    width:100%;
    overflow-x:auto
  }

  .greeting{
    flex-direction:column;
    align-items:start;
    gap:12px
  }

  .drawer-grid,.form-grid,.docs{
    grid-template-columns:1fr
  }

  .call-row{
    flex-wrap:wrap
  }

  .call-row .person{
    min-width:180px
  }

  .section-head{
    flex-direction:column
  }

  .overlay{
    justify-content:center
  }

  .modal{
    margin:12px
  }
}

@media(max-width:520px){
  .kpis{
    grid-template-columns:1fr
  }

  .greeting h1,.section-head h1{
    font-size:29px
  }

  .banner h2{
    font-size:23px
  }

  .search{
    order:2;
    width:100%
  }

  .add-btn{
    margin-left:auto
  }

  .funnel-row{
    grid-template-columns:90px 1fr 24px
  }
}

-- TriCity Health Wala CRM: Supabase setup (secure version)
-- Paste ALL of this into Supabase -> SQL Editor -> New query -> Run.
-- Safe to run more than once.
--
-- Who can do what after this runs:
--   * Public landing page (anon key): can ONLY ADD a new lead. Cannot read,
--     edit or delete anything.
--   * Logged-in users whose email is in team_members: can read, add and
--     edit leads, policies and follow-ups.
--   * Any other logged-in user: sees nothing.
--   * Nobody can delete leads from the website (do it in the dashboard).
-- =====================================================================

-- ---------- 1. Tables -------------------------------------------------
create table if not exists public.leads (
  id bigint generated always as identity primary key,
  name text not null,
  phone text not null,
  whatsapp text,
  age int,
  city text,
  who_is_it_for text,
  family_size int,
  existing_policy text,
  sum_insured numeric,
  budget numeric,
  company text,
  commission numeric,
  source text default 'Landing Page',
  stage text default 'New Lead',
  assigned_to text default 'Prateek',
  priority text default 'Warm',
  next_followup date,
  notes text,
  consent boolean default false,
  consent_at timestamptz,
  created_at timestamptz default now()
);

-- Add any columns missing from an older version of the table
alter table public.leads add column if not exists family_size int;
alter table public.leads add column if not exists existing_policy text;
alter table public.leads add column if not exists company text;
alter table public.leads add column if not exists commission numeric;
alter table public.leads add column if not exists consent boolean default false;
alter table public.leads add column if not exists consent_at timestamptz;

create table if not exists public.team_members (
  id bigint generated always as identity primary key,
  name text not null,
  role text default 'Team Member',
  city text,
  auth_email text unique,
  created_at timestamptz default now()
);

create table if not exists public.policies (
  id bigint generated always as identity primary key,
  policy_no text, client text, company text, sum_insured numeric,
  premium numeric, commission numeric, issue_date date, renewal_date date,
  assigned_to text, lead_id bigint references public.leads(id),
  created_at timestamptz default now()
);

create table if not exists public.follow_ups (
  id bigint generated always as identity primary key,
  lead_id bigint references public.leads(id),
  note text, next_call date, done boolean default false,
  created_at timestamptz default now()
);

-- ---------- 2. "Is this person on my team?" check ---------------------
create or replace function public.is_team_member()
returns boolean
language sql stable security definer
set search_path = public
as $$
  select exists (
    select 1 from public.team_members
    where lower(auth_email) = lower(auth.jwt() ->> 'email')
  );
$$;
revoke all on function public.is_team_member() from public;
grant execute on function public.is_team_member() to anon, authenticated;

-- ---------- 3. Turn on Row Level Security -----------------------------
alter table public.leads        enable row level security;
alter table public.team_members enable row level security;
alter table public.policies     enable row level security;
alter table public.follow_ups   enable row level security;

-- ---------- 4. Remove ALL old (unsafe) policies -----------------------
drop policy if exists "Team can read leads"            on public.leads;
drop policy if exists "Team can add leads"             on public.leads;
drop policy if exists "Team can update leads"          on public.leads;
drop policy if exists "Anon and team can read leads"   on public.leads;
drop policy if exists "Anon and team can add leads"    on public.leads;
drop policy if exists "Anon and team can update leads" on public.leads;
drop policy if exists "Public can submit a lead"       on public.leads;
drop policy if exists "Team members read leads"        on public.leads;
drop policy if exists "Team members add leads"         on public.leads;
drop policy if exists "Team members update leads"      on public.leads;
drop policy if exists "Team can read team"             on public.team_members;
drop policy if exists "Team members read team"         on public.team_members;
drop policy if exists "Team can manage policies"       on public.policies;
drop policy if exists "Team members manage policies"   on public.policies;
drop policy if exists "Team can manage follow-ups"     on public.follow_ups;
drop policy if exists "Team members manage follow-ups" on public.follow_ups;

-- ---------- 5. New safe policies --------------------------------------
-- Landing page: add only, as a fresh "New Lead", with sane sizes.
create policy "Public can submit a lead" on public.leads
  for insert to anon
  with check (
    stage = 'New Lead'
    and char_length(name)  between 1 and 100
    and char_length(phone) between 10 and 15
    and coalesce(char_length(notes), 0) <= 1000
    and consent = true
  );

-- CRM team
create policy "Team members read leads" on public.leads
  for select to authenticated using (public.is_team_member());
create policy "Team members add leads" on public.leads
  for insert to authenticated with check (public.is_team_member());
create policy "Team members update leads" on public.leads
  for update to authenticated
  using (public.is_team_member()) with check (public.is_team_member());

create policy "Team members read team" on public.team_members
  for select to authenticated using (public.is_team_member());

create policy "Team members manage policies" on public.policies
  for all to authenticated
  using (public.is_team_member()) with check (public.is_team_member());

create policy "Team members manage follow-ups" on public.follow_ups
  for all to authenticated
  using (public.is_team_member()) with check (public.is_team_member());

-- ---------- 6. Table permissions (extra safety layer) -----------------
revoke all on public.leads, public.team_members, public.policies, public.follow_ups from anon;
grant insert on public.leads to anon;
grant select, insert, update on public.leads to authenticated;
grant select on public.team_members to authenticated;
grant select, insert, update on public.policies, public.follow_ups to authenticated;
